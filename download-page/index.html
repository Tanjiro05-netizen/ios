<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marxist Library - Download</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0a0a 0%, #0d0d0d 100%);
            color: #e5e2e1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .logo {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
        }
        .download-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #c81e1e;
            color: #fff;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #a51818; }
        .btn svg {
            width: 20px;
            height: 20px;
        }
        .meta {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .version {
            font-size: 14px;
            color: #c81e1e;
            font-weight: 600;
        }
        .requirements {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
        .note {
            margin-top: 24px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 24px 0;
            text-align: left;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #aaa;
        }
        .feature-icon {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="logo">☭</div>
    <h1>Marxist Library</h1>
    <p class="subtitle">Workers of the world, unite!</p>

    <div class="download-card">
        <div class="features">
            <div class="feature">
                <span class="feature-icon">📚</span>
                <span>Digital Library</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🎧</span>
                <span>Audiobooks</span>
            </div>
            <div class="feature">
                <span class="feature-icon">💬</span>
                <span>Forum</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🔔</span>
                <span>Notifications</span>
            </div>
        </div>

        <a class="btn" href="./MarxistLibrary.apk" download>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download for Android
        </a>

        <div class="meta">
            <div class="version">Version 1.0.0</div>
            <div class="requirements">Android 6.0+ required</div>
        </div>

        <p class="note">
            After downloading, open the APK file and tap "Install".<br>
            You may need to enable "Install from unknown sources" in your security settings.
        </p>
    </div>
</body>
</html>
